<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
  <title>Messages</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232f5bd3'/%3E%3Cstop offset='1' stop-color='%233d6ee0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M9 0h14a9 9 0 0 1 9 9v14a9 9 0 0 1-9 9H3a3 3 0 0 1-3-3V9a9 9 0 0 1 9-9z' fill='url(%23g)'/%3E%3Cpath d='M9 13h14M9 19h8' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body data-view="list">
  <div class="app">

    <!-- SIDEBAR: conversation list -->
    <aside class="sidebar" aria-label="Conversations">
      <header class="sidebar-head">
        <span class="wordmark">Messages</span>
        <button class="icon-btn accent" id="newChatBtn" type="button" title="New conversation" aria-label="New conversation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </header>

      <div class="conv-list" id="convList" role="list"></div>

      <footer class="sidebar-foot">
        <span class="avatar avatar-sm" id="meAvatar" aria-hidden="true"></span>
        <span class="me-name" id="meName"></span>
        <button class="icon-btn" id="logoutBtn" type="button" title="Log out" aria-label="Log out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><path d="M12 2v10"/></svg>
        </button>
      </footer>
    </aside>

    <!-- CHAT PANE -->
    <main class="chat" aria-label="Conversation">
      <header class="chat-head" id="chatHead">
        <button class="icon-btn back-btn" id="backBtn" type="button" title="Back" aria-label="Back to conversations">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <span class="chat-face" id="chatFace" aria-hidden="true"></span>
        <span class="chat-head-text">
          <h1 class="chat-title" id="chatTitle"></h1>
          <span class="chat-sub" id="chatSub"></span>
        </span>

        <!-- Conversation menu. Items are shown/hidden per chat by renderChatMenu(). -->
        <div class="chat-menu" id="chatMenu" hidden>
          <button class="icon-btn" id="chatMenuBtn" type="button" title="Conversation options"
                  aria-label="Conversation options" aria-haspopup="true" aria-expanded="false" aria-controls="chatMenuList">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>
          </button>
          <div class="menu" id="chatMenuList" role="menu" aria-labelledby="chatMenuBtn" hidden>
            <button class="menu-item" id="menuMembers" type="button" role="menuitem">Members &amp; roles</button>
            <button class="menu-item" id="menuAddPeople" type="button" role="menuitem">Add people</button>
            <button class="menu-item" id="menuLeave" type="button" role="menuitem">Leave group</button>
            <button class="menu-item danger" id="menuDelete" type="button" role="menuitem">Delete group</button>
          </div>
        </div>
      </header>

      <div class="conn-banner" id="connBanner" role="status" hidden></div>

      <!-- Empty state: no conversation picked (desktop) -->
      <div class="stage" id="chatEmpty">
        <div class="stage-art" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--art-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
        </div>
        <h2 class="stage-title">No conversation selected</h2>
        <p class="stage-copy">Choose one from the list, or start a new conversation.</p>
      </div>

      <div class="messages" id="messages" hidden></div>

      <footer class="composer" id="composer" hidden>
        <div class="composer-pill">
          <textarea id="composerInput" rows="1" placeholder="Write a message" aria-label="Message" autocomplete="off" enterkeyhint="send"></textarea>
          <button class="send-btn" id="sendBtn" type="button" title="Send" aria-label="Send message" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <div class="sending-hint" id="sendingHint" hidden>Sending…</div>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="alert" hidden></div>

  <!-- People picker backed by GET /api/users?q=. Two flows share this one dialog and one
       search pipeline (see `picker.mode` in app.js): starting a conversation, and adding
       people to an open group — in which case it opens on top of #membersDialog. The
       heading, the group-name row and the submit label are what change. -->
  <dialog class="dialog picker" id="newChatDialog" aria-labelledby="newChatTitle">
    <form id="newChatForm" method="dialog">
      <h2 id="newChatTitle">New conversation</h2>

      <div class="picker-field" id="pickerField">
        <div class="chips" id="pickerChips"></div>
        <input type="text" id="pickerInput" placeholder="Search people" autocomplete="off"
               role="combobox" aria-expanded="false" aria-controls="pickerResults"
               aria-autocomplete="list" aria-label="Search people" />
      </div>

      <ul class="picker-results" id="pickerResults" role="listbox" aria-label="People"></ul>
      <p class="picker-status" id="pickerStatus" role="status"></p>

      <label class="group-name" id="groupNameRow" hidden>
        <span>Group name</span>
        <input type="text" id="groupNameInput" maxlength="255" placeholder="What's this about?" />
      </label>

      <div class="form-error" id="newChatError" role="alert"></div>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary" id="newChatSubmit" disabled>Message</button>
      </div>
    </form>
  </dialog>

  <!-- Group details: who is in the conversation, who runs it, and the actions that change
       that. Roles and membership come from GET /api/chats (there is no members endpoint),
       so every successful change_role / add_member / leave is followed by a chats refresh.
       renderMembers() fills the head, the roster and the footer; roster rows are grouped
       by role, so no row needs to repeat its own role badge. -->
  <dialog class="dialog panel" id="membersDialog" aria-labelledby="membersTitle" aria-describedby="membersSub">
    <form id="membersForm" method="dialog">
      <header class="panel-head">
        <span class="panel-face" id="membersFace" aria-hidden="true"></span>
        <span class="panel-head-text">
          <h2 id="membersTitle">Members</h2>
          <p class="panel-sub" id="membersSub"></p>
        </span>
      </header>

      <p class="panel-note" id="membersStatus" role="status"></p>

      <div class="roster" id="memberList"></div>

      <div class="form-error" id="membersError" role="alert"></div>
      <div class="dialog-actions panel-actions">
        <button type="button" class="btn quiet caution" id="membersLeave">Leave group</button>
        <span class="actions-spacer" aria-hidden="true"></span>
        <button type="button" class="btn ghost" id="membersClose" data-close>Close</button>
        <button type="button" class="btn primary" id="membersAdd">Add people</button>
      </div>
    </form>
  </dialog>

  <!-- Confirmation for the destructive menu items; filled in by openConfirm(). -->
  <dialog class="dialog" id="confirmDialog" aria-labelledby="confirmTitle">
    <form id="confirmForm" method="dialog">
      <h2 id="confirmTitle"></h2>
      <p class="dialog-copy" id="confirmCopy"></p>
      <div class="form-error" id="confirmError" role="alert"></div>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn danger" id="confirmOk">Delete</button>
      </div>
    </form>
  </dialog>

  <!-- Illustrations cloned into JS-rendered empty states (SVG needs the right namespace). -->
  <template id="artNoChats">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--art-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M12 9v6M9 12h6"/></svg>
  </template>
  <template id="artSayHi">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--art-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01" stroke-width="2.2"/></svg>
  </template>

  <script src="/js/api.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
