<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./css/styles.css">
        <link rel="stylesheet" href="./css/index.css">
        <script src="https://kit.fontawesome.com/d6d8abd1a5.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="navbar">
            <img class="profile_picture" src="assets/images/default_profile.png" alt="image failed to load" width=50 height=50>
            <div class="navbar-items">
                <div class="navbar-item">
                    <i class="fa-regular fa-message"></i>
                    <p hidden>Messages</p>
                </div>
                <div class="navbar-item setting">
                    <i class="fa-solid fa-gear"></i>
                    <p hidden>Settings</p>
                </div>
            </div>
        </div>
        <div class="searchbar-area">
            <form class="searchbar-form">
            <input class="searchbar" type="text" name="search">
            <button id="search" class="mg"><i class="fa-solid fa-magnifying-glass "></i></button>
            </form>
        </div>
        <div class="chat_history">
            2
        </div>
        <div class="statusbar">
            4
        </div>
        <div class="main_chats">
            6
        </div>
        <div class="infobox">
            5
        </div>
    </body>
</html>
