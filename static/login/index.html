<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="./login.css">
        <style>
        @import url('https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400..700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap');
        </style>
    </head>
    <body>
        <div class="main-container">
            <div class="left-container">
                <div class="title">WSC</div>
            </div>
            <div class="right-container">
                <p class="register">Not a member? <a href="/register">Register now</a></p>
                <p class="login-text">Sign in</p>
                <form method="POST" action="/api/login">
                    <div class="input-div">
                        <input type="text" name="username" placeholder="Username"></input>
                    </div>
                    <div class="input-div">
                        <input type="text" name="password" placeholder="Password"></input>
                        <a href="/" class="vague forgot">Forgot password</a>
                    </div>
                </form>
                    <button class="login-button">Sign In</button><br>
            </div>
        </div>
    </body>
</html>
