<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
  <title>Sign in · Messages</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232f5bd3'/%3E%3Cstop offset='1' stop-color='%233d6ee0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M9 0h14a9 9 0 0 1 9 9v14a9 9 0 0 1-9 9H3a3 3 0 0 1-3-3V9a9 9 0 0 1 9-9z' fill='url(%23g)'/%3E%3Cpath d='M9 13h14M9 19h8' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/login/login.css" />
</head>
<body>
  <main class="card" aria-labelledby="heading">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14M5 13h9"/></svg>
    </div>
    <h1 id="heading">Messages</h1>
    <p class="tagline">Talk to your people.</p>

    <div class="segmented" role="tablist" aria-label="Sign in or create account">
      <button type="button" role="tab" id="tabLogin" class="active" aria-selected="true" data-mode="login">Sign in</button>
      <button type="button" role="tab" id="tabRegister" aria-selected="false" data-mode="register">Create account</button>
    </div>

    <form id="authForm" novalidate>
      <label>
        <span>Username</span>
        <input type="text" name="username" autocomplete="username" maxlength="255" required autofocus />
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <div class="error" id="error" role="alert"></div>
      <button type="submit" class="submit" id="submitBtn">Sign in</button>
    </form>
  </main>

  <script src="/login/login.js"></script>
</body>
</html>
