<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#16120e" media="(prefers-color-scheme: dark)" />
  <title>Sign in · Messages</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b03a2e'/%3E%3Cpath d='M8 12h16M8 17h11' stroke='%23fffaf3' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/login/login.css" />
</head>
<body>
  <main class="card" aria-labelledby="heading">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14M5 13h9"/></svg>
    </div>
    <h1 id="heading">Messages</h1>
    <p class="tagline">Warm, quiet, and to the point.</p>

    <div class="segmented" role="tablist" aria-label="Sign in or create account">
      <button type="button" role="tab" id="tabLogin" class="active" aria-selected="true" data-mode="login">Sign in</button>
      <button type="button" role="tab" id="tabRegister" aria-selected="false" data-mode="register">Create account</button>
    </div>

    <form id="authForm" novalidate>
      <label>
        <span>Username</span>
        <input type="text" name="username" autocomplete="username" maxlength="255" required autofocus />
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <div class="error" id="error" role="alert"></div>
      <button type="submit" class="submit" id="submitBtn">Sign in</button>
    </form>
  </main>

  <script src="/login/login.js"></script>
</body>
</html>
