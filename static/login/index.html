<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../css/styles.css">
        <link rel="stylesheet" href="../css/login.css">
        <script src="../js/login.js" defer></script>
        <style>
        @import url('https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400..700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap');
        </style>
    </head>
    <body>
        <video autoplay muted loop>
            <source src="./asd.mp4" type="video/mp4">
        </video>
        <div class="main-container">
            <div class="left-container">
                <div class="title">WSC</div>
            </div>
            <div class="right-container">
                <p class="vague register">Not a member? <a id="register" href="#">Register now</a></p>
                <p id="login-text" class="login-text">Sign in</p>
                <form id="login">
                    <div class="input-div">
                        <input type="text" name="username" placeholder="Username"></input>
                    </div>
                    <div class="input-div">
                        <input type="password" name="password" placeholder="Password">
                        <a href="#" class="vague forgot">Forgot password</a>
                    </div>
                    <button id="login-button" type="submit" class="login-button">Sign In</button><br>
                </form>
            </div>
        </div>
    </body>
</html>
