<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Sign in · Messages</title>
  <link rel="stylesheet" href="/login/login.css" />
</head>
<body>
  <main class="card" aria-labelledby="heading">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>
    </div>
    <h1 id="heading">Messages</h1>

    <div class="segmented" role="tablist" aria-label="Sign in or create account">
      <button type="button" role="tab" id="tabLogin" class="active" aria-selected="true" data-mode="login">Sign in</button>
      <button type="button" role="tab" id="tabRegister" aria-selected="false" data-mode="register">Create account</button>
    </div>

    <form id="authForm" novalidate>
      <label>
        <span>Username</span>
        <input type="text" name="username" autocomplete="username" maxlength="255" required autofocus />
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <div class="error" id="error" role="alert"></div>
      <button type="submit" class="submit" id="submitBtn">Sign in</button>
    </form>
  </main>

  <script src="/login/login.js"></script>
</body>
</html>
